name: rb-mcp-demo-prod


on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
    main:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v2

            - name: Configure AWS credentials for ECR
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1
           
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag, and push docker image to Amazon ECR
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  REPOSITORY: mcp-demo-chatbot-prod
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
                  docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

            - name: eks login
              id: eks-login
              run: |
                  aws eks update-kubeconfig --region us-east-1 --name rb-us-prod-cluster

            - name: Update deployment
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  REPOSITORY: mcp-demo-chatbot-prod
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  kubectl set image deployment/mcp-chatbot mcp-chatbot=$REGISTRY/$REPOSITORY:$IMAGE_TAG

            - name: Check deployment status
              run: |
                  kubectl rollout status deployment/mcp-chatbot
