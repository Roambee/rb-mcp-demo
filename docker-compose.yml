
version: '3.8'

services:
  roambee-chat:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=docker
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_USERS=50
      - KUBERNETES_MODE=false
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - roambee-chat
    restart: unless-stopped
